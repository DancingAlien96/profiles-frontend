# Este repositorio es solo el frontend, asi que la raiz del build es la raiz
# del repositorio (no una subcarpeta).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Las fotos y las imagenes de vista previa cambian solo cuando se regenera el
# sitio, asi que pueden cachearse con holgura.
[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
